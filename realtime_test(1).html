<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>speechvoice2 realtime voice test</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1220;
      color: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 10%, rgba(14, 165, 233, .18), transparent 32%),
        linear-gradient(135deg, #111827 0%, #0f172a 52%, #111827 100%);
    }
    main {
      width: min(1080px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
    }
    .subtle {
      color: #94a3b8;
      line-height: 1.65;
      margin: 0 0 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 14px;
    }
    .panel {
      border: 1px solid rgba(148, 163, 184, .24);
      border-radius: 10px;
      background: rgba(15, 23, 42, .76);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .26);
      padding: 16px;
    }
    label {
      display: block;
      color: #cbd5e1;
      font-weight: 650;
      margin: 0 0 8px;
    }
    input {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, .35);
      border-radius: 8px;
      background: #0f172a;
      color: #f8fafc;
      padding: 11px 12px;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #38bdf8; }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
      align-items: center;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      color: #061018;
      background: #38bdf8;
      font-weight: 750;
      cursor: pointer;
    }
    button.secondary { background: #a78bfa; }
    button.stop { background: #fb7185; }
    button:disabled {
      opacity: .48;
      cursor: not-allowed;
    }
    code {
      background: rgba(15, 23, 42, .92);
      border: 1px solid rgba(148, 163, 184, .22);
      border-radius: 6px;
      padding: 2px 6px;
      color: #bfdbfe;
    }
    .status-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      color: #cbd5e1;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(59, 130, 246, .18);
      color: #93c5fd;
      font-size: 13px;
      font-weight: 700;
    }
    .meter {
      position: relative;
      width: 180px;
      height: 9px;
      border-radius: 999px;
      background: #1e293b;
      overflow: hidden;
    }
    .meter > i {
      display: block;
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #facc15);
    }
    .url {
      margin-top: 10px;
      word-break: break-all;
      color: #bfdbfe;
      font-size: 13px;
      line-height: 1.55;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 280px;
      margin: 10px 0 0;
      line-height: 1.8;
      font-size: 17px;
      color: #f8fafc;
    }
    .log {
      max-height: 310px;
      overflow: auto;
      margin-top: 10px;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.55;
    }
    .log div {
      padding: 6px 0;
      border-bottom: 1px solid rgba(148, 163, 184, .12);
    }
    .hint {
      margin-top: 12px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.7;
    }
    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      main { width: min(100vw - 20px, 1080px); }
    }
  </style>
</head>
<body>
  <main>
    <h1>speechvoice2 实时语音听写测试</h1>
    <p class="subtle">
      推荐启动本地静态服务后访问：<code>cd D:\wwwroot\speechvoice2\backend</code>
      <code>python -m http.server 18080</code>
      <code>http://127.0.0.1:18080/realtime_test.html</code>
    </p>

    <div class="grid">
      <section class="panel">
        <label for="backendUrl">后端地址</label>
        <input id="backendUrl" value="http://127.0.0.1:9005" spellcheck="false" />
        <label for="apiToken" style="margin-top:12px;">API Token</label>
        <input id="apiToken" type="password" placeholder="SV_API_TOKEN" autocomplete="off" spellcheck="false" />
        <div class="buttons">
          <button id="authBtn" class="secondary">获取 WebSocket URL</button>
          <button id="startBtn">开始录音</button>
          <button id="stopBtn" class="stop" disabled>停止录音</button>
          <span class="badge" id="status">idle</span>
          <span class="meter" title="麦克风音量"><i id="meter"></i></span>
        </div>
        <div class="url" id="wsUrl">WebSocket URL: -</div>
        <div class="hint">
          浏览器麦克风需要安全上下文；<code>http://127.0.0.1</code> 属于允许场景。
          如果测试线上 HTTPS 后端，请将后端地址填写为 HTTPS 域名。
        </div>
      </section>

      <section class="panel">
        <strong>日志</strong>
        <div class="log" id="log"></div>
      </section>
    </div>

    <section class="panel" style="margin-top:14px;">
      <strong>识别文本</strong>
      <pre id="text"></pre>
    </section>
  </main>

  <script>
    const APPID = "speechvoice2";
    const FRAME = { FIRST: 0, CONTINUE: 1, LAST: 2 };

    let socket = null;
    let audioContext = null;
    let mediaStream = null;
    let processor = null;
    let firstFrame = true;
    let segments = [];

    const backendUrlInput = document.getElementById("backendUrl");
    const apiTokenInput = document.getElementById("apiToken");
    const authBtn = document.getElementById("authBtn");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusEl = document.getElementById("status");
    const meterEl = document.getElementById("meter");
    const wsUrlEl = document.getElementById("wsUrl");
    const logEl = document.getElementById("log");
    const textEl = document.getElementById("text");

    function backendBase() {
      return backendUrlInput.value.trim().replace(/\/+$/, "");
    }

    function redactedWebSocketUrl(value) {
      const parsed = new URL(value);
      parsed.search = "";
      return `${parsed.toString()}?ticket=<redacted>`;
    }

    function setStatus(value) {
      statusEl.textContent = value;
      log(value);
    }

    function log(message, detail) {
      const line = document.createElement("div");
      line.textContent = `[${new Date().toLocaleTimeString()}] ${message}${detail ? " " + detail : ""}`;
      logEl.prepend(line);
    }

    async function fetchWebSocketUrl() {
      const url = `${backendBase()}/api/voice/auth/`;
      const token = apiTokenInput.value.trim();
      if (!token) {
        throw new Error("请输入 SV_API_TOKEN");
      }
      log("GET", url);
      const res = await fetch(url, {
        method: "GET",
        headers: { Authorization: `Bearer ${token}` }
      });
      const json = await res.json();
      if (!res.ok || !json || json.code !== 0 || !json.data || !json.data.url) {
        throw new Error(`获取 WebSocket URL 失败: ${JSON.stringify(json)}`);
      }
      const displayUrl = redactedWebSocketUrl(json.data.url);
      wsUrlEl.textContent = `WebSocket URL: ${displayUrl}`;
      log("WebSocket session", `sid=${json.data.sid} expires_in=${json.data.expires_in}s`);
      return json.data.url;
    }

    function arrayBufferToBase64(buffer) {
      let binary = "";
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.byteLength; i += 1) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    function resampleAndConvertTo16kPCM(float32Data, inputSampleRate) {
      const targetRate = 16000;
      const ratio = inputSampleRate / targetRate;
      const newLength = Math.max(1, Math.round(float32Data.length / ratio));
      const result = new Int16Array(newLength);
      let peak = 0;
      for (let i = 0; i < newLength; i += 1) {
        const srcIndex = Math.min(Math.round(i * ratio), float32Data.length - 1);
        const sample = Math.max(-1, Math.min(1, float32Data[srcIndex] || 0));
        peak = Math.max(peak, Math.abs(sample));
        result[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
      }
      meterEl.style.width = `${Math.min(100, Math.round(peak * 100))}%`;
      return result.buffer;
    }

    function sendFrame(audioData, frameStatus) {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        return;
      }
      const frame = {
        data: {
          status: frameStatus,
          format: "audio/L16;rate=16000",
          encoding: "raw",
          audio: audioData ? arrayBufferToBase64(audioData) : ""
        }
      };
      if (frameStatus === FRAME.FIRST) {
        frame.common = { app_id: APPID };
        frame.business = {
          language: "zh_cn",
          domain: "iat",
          accent: "mandarin",
          dwa: "wpgs",
          vad_eos: 5000
        };
      }
      socket.send(JSON.stringify(frame));
    }

    function parseText(result) {
      const ws = result && result.data && result.data.result && result.data.result.ws;
      if (!Array.isArray(ws)) {
        return "";
      }
      return ws.map((item) => {
        const cw = item && item.cw;
        return Array.isArray(cw) && cw[0] && typeof cw[0].w === "string" ? cw[0].w : "";
      }).join("");
    }

    function handleMessage(data) {
      let result;
      try {
        result = JSON.parse(data);
      } catch (error) {
        log("JSON 解析失败", String(error));
        return;
      }
      if (result.code !== 0) {
        setStatus(`error ${result.code}: ${result.message || "unknown"}`);
        if (result.sid) log("sid", result.sid);
        return;
      }
      const text = parseText(result);
      if (text) {
        segments.push(text);
        textEl.textContent = segments.join("");
      }
      if (result.data && result.data.status === FRAME.LAST) {
        setStatus("done");
      } else {
        setStatus("recognizing");
      }
    }

    async function openSocket() {
      const wsUrl = await fetchWebSocketUrl();
      socket = new WebSocket(wsUrl);
      await new Promise((resolve, reject) => {
        socket.onopen = resolve;
        socket.onerror = reject;
        socket.onmessage = (event) => handleMessage(event.data);
        socket.onclose = () => setStatus("closed");
      });
      setStatus("connected");
    }

    async function startRecording() {
      if (!window.isSecureContext) {
        throw new Error("麦克风采集需要 HTTPS 或 http://127.0.0.1。");
      }
      await stopRecording({ sendLastFrame: false });
      await openSocket();
      segments = [];
      textEl.textContent = "";
      firstFrame = true;

      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          sampleRate: 16000,
          channelCount: 1,
          echoCancellation: true,
          noiseSuppression: true
        }
      });
      audioContext = new AudioContext({ sampleRate: 16000 });
      const source = audioContext.createMediaStreamSource(mediaStream);
      processor = audioContext.createScriptProcessor(4096, 1, 1);
      processor.onaudioprocess = (event) => {
        const pcm = resampleAndConvertTo16kPCM(
          event.inputBuffer.getChannelData(0),
          audioContext.sampleRate
        );
        sendFrame(pcm, firstFrame ? FRAME.FIRST : FRAME.CONTINUE);
        firstFrame = false;
      };
      source.connect(processor);
      processor.connect(audioContext.destination);
      startBtn.disabled = true;
      stopBtn.disabled = false;
      setStatus("recording");
    }

    async function stopRecording(options = { sendLastFrame: true }) {
      const activeSocket = socket;
      if (options.sendLastFrame && activeSocket && activeSocket.readyState === WebSocket.OPEN) {
        sendFrame(new ArrayBuffer(0), FRAME.LAST);
      }
      if (processor) {
        processor.disconnect();
        processor = null;
      }
      if (audioContext) {
        await audioContext.close().catch(() => {});
        audioContext = null;
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach((track) => track.stop());
        mediaStream = null;
      }
      if (activeSocket) {
        setTimeout(() => activeSocket.close(), options.sendLastFrame ? 1800 : 0);
      }
      socket = null;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      meterEl.style.width = "0%";
    }

    authBtn.addEventListener("click", () => {
      fetchWebSocketUrl().catch((error) => setStatus(`error: ${error.message}`));
    });
    startBtn.addEventListener("click", () => {
      startRecording().catch((error) => setStatus(`error: ${error.message}`));
    });
    stopBtn.addEventListener("click", () => {
      stopRecording().catch((error) => setStatus(`error: ${error.message}`));
    });
  </script>
</body>
</html>
